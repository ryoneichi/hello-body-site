<style>

<body><canvas id="game" role="application" aria-label="3つ以上同じ色をそろえるパズルゲーム。タップ2回かドラッグでピースを入れ替えます。"></canvas><div id="orientation"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2,COLS=11,ROWS=10,PALETTE=['#e53244','#218df1','#50d83b','#ffce36'];
const LEVELS=[
 {label:'花の庭',moves:31,mask:["11111011111","01110011100","11111011111","00000000000","11111111111","11111111111","11111111111","11111111111","11111011111","11111011111"],jellies:29,records:7,crates:11},
 {label:'風車の道',moves:32,mask:["00010111100","00111111110","01111111111","11111100111","01111101111","11111111111","01111111111","00111111110","00011111100","00001111000"],jellies:27,records:0,crates:10,stones:7},
 {label:'ひみつの広場',moves:34,mask:["11111011111","11111011111","01111111110","11111111111","11100100111","11111111111","01111111110","11111011111","11111011111","01111011110"],jellies:34,records:9,crates:12},
 {label:'虹の小径',moves:35,mask:["01111011110","11111111111","11111111111","11100000111","11111111111","11111111111","11100000111","11111111111","11111111111","01111011110"],jellies:35,records:6,crates:16},
 {label:'夕焼けの公園',moves:36,mask:["11111111111","11111111111","01111111110","00111111100","11111111111","11111111111","00111111100","01111111110","11111111111","11111111111"],jellies:38,records:10,crates:12}
];
let W=0,H=0, dpr=1, layout=null,grid=[],lvl=0,progress=1,score=0,moves=0,goalJelly=0,goalBlock=0,goalType='record',busy=false,selected=null,mode='welcome',tool=null,tools={hammer:2,rocket:2,shuffle:1,rainbow:1},floating=[],particles=[],pressed=null,shake=null,hint=null,lastAction=performance.now(),combo=0,turnNum=0,sound=true,faceSeed=1234,menuButtons=[],winStars=0;
const bkgStars=Array.from({length:34},(_,i)=>({x:(i*73+17)%1000/1000,y:(i*51+13)%500/500,a:.23+((i*17)%60)/100}));
try{progress=Math.max(1,Math.min(LEVELS.length,parseInt(localStorage.getItem('gardenGemUnlocked'))||1));sound=localStorage.getItem('gardenGemSound')!=='off';}catch(e){}
const rand=n=>Math.floor(Math.random()*n),clamp=(a,min,max)=>Math.max(min,Math.min(max,a)),mix=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function txt(s,x,y,font,color,align='center',shadow=false){ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline='middle';if(shadow){ctx.shadowColor='rgba(60,50,50,.65)';ctx.shadowBlur=3;ctx.shadowOffsetY=2}ctx.fillStyle=color;ctx.fillText(String(s),x,y);ctx.restore()}
function grad(x1,y1,x2,y2,colors){let g=ctx.createLinearGradient(x1,y1,x2,y2);colors.forEach(([p,c])=>g.addColorStop(p,c));return g}
function radial(x,y,r,c1,c2){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function ellipse(x,y,rx,ry,fill){if(typeof ry==='string'){fill=ry;ry=rx}ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function poly(pts,fill,stroke,lw=1){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function resize(){let rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const land=W/H>1.18;let tile=land?Math.min(H/11.65,W/18.8):Math.min((W-22)/11,(H-260)/10.5);tile=Math.max(16,tile);let bw=COLS*tile,bh=ROWS*tile;let x=land?W/2-bw/2:W/2-bw/2,y=land?(H-bh)/2+12:Math.max(155,(H-bh)/2-4);const hud=land?{x:Math.max(12,x-Math.min(150,W*.14)),y:H*.18,w:Math.min(122,W*.12),h:H*.64}:{x:14,y:Math.max(58,y-91),w:W-28,h:70};const booster=land?{x:Math.min(W-54,x+bw+Math.max(24,(W-x-bw)*.43)),y:H*.19,vertical:true}:{x:W/2,y:Math.min(H-52,y+bh+45),vertical:false};layout={tile,bw,bh,x,y,land,hud,booster};}
window.addEventListener('resize',resize,{passive:true});resize();
function makeCell(){return {on:false,g:-1,s:null,j:0,block:null,hp:0}}
function maskAt(level,r,c){return LEVELS[level].mask[r][c]==='1'}
function startLevel(n,intro=false){lvl=clamp(n,0,LEVELS.length-1);let cfg=LEVELS[lvl];grid=Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>{let cell=makeCell();cell.on=maskAt(lvl,r,c);return cell}));
  let cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].on)cells.push({r,c});
  // Spread blockers across the playable area; avoid sealing narrow entrances.
  let picks=cells.filter(({r,c})=>r>=1&&r<=8&&((r+c)%3!==0));shuffle(picks);let obstacles=[];
  for(let i=0;i<cfg.crates;i++){let p=picks.pop();if(!p)break;let a=grid[p.r][p.c];a.block='crate';a.hp=1;obstacles.push(p)}
  let specialBlock=cfg.records?'record':'stone',total=cfg.records||cfg.stones||0;goalType=specialBlock;
  for(let i=0;i<total;i++){let p=picks.pop();if(!p)break;let a=grid[p.r][p.c];a.block=specialBlock;a.hp=1;obstacles.push(p)}
  goalBlock=total;
  const open=cells.filter(({r,c})=>!grid[r][c].block);shuffle(open);for(let i=0;i<Math.min(cfg.jellies,open.length);i++)grid[open[i].r][open[i].c].j=1;goalJelly=Math.min(cfg.jellies,open.length);
  // Guarantee that the opening board has no accidental automatic matches.
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let a=grid[r][c];if(!a.on||a.block)continue;let valid=[0,1,2,3].filter(g=>!((c>=2&&grid[r][c-1]?.g===g&&grid[r][c-2]?.g===g)||(r>=2&&grid[r-1][c]?.g===g&&grid[r-2][c]?.g===g)));a.g=valid.length?valid[rand(valid.length)]:rand(4);}
  moves=cfg.moves;score=0;tool=null;tools={hammer:2,rocket:2,shuffle:2,rainbow:1};selected=null;busy=false;combo=0;floating=[];particles=[];turnNum=0;hint=null;lastAction=performance.now();mode=intro?'welcome':'play';
  if(!findMove())rearrange();}
function shuffle(a){for(let i=a.length-1;i>0;i--){let k=rand(i+1);[a[i],a[k]]=[a[k],a[i]]}return a}
function get(r,c){return (r>=0&&r<ROWS&&c>=0&&c<COLS)?grid[r][c]:null}
function gemCell(r,c){let a=get(r,c);return a&&a.on&&!a.block&&a.g>=0}
function swapGem(a,b){const A=get(a.r,a.c),B=get(b.r,b.c);[A.g,B.g]=[B.g,A.g];[A.s,B.s]=[B.s,A.s]}
function getMatches(){let groups=[];for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){if(!gemCell(r,c)){c++;continue}let typ=grid[r][c].g,e=c+1;while(e<COLS&&gemCell(r,e)&&grid[r][e].g===typ)e++;if(e-c>=3)groups.push(Array.from({length:e-c},(_,i)=>({r,c:c+i})));c=e}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){if(!gemCell(r,c)){r++;continue}let typ=grid[r][c].g,e=r+1;while(e<ROWS&&gemCell(e,c)&&grid[e][c].g===typ)e++;if(e-r>=3)groups.push(Array.from({length:e-r},(_,i)=>({r:r+i,c})));r=e}}return groups}
function findMove(){let options=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(!gemCell(r,c))continue;for(let [dr,dc] of [[0,1],[1,0]]){let t={r:r+dr,c:c+dc};if(!gemCell(t.r,t.c))continue;let a={r,c},A=get(r,c),B=get(t.r,t.c);if(A.s||B.s)return[a,t];if(A.g===B.g)continue;swapGem(a,t);let good=getMatches().length>0;swapGem(a,t);if(good)options.push([a,t])}}return options.length?options[rand(options.length)]:null}
function rearrange(){let positions=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(gemCell(r,c)){let a=grid[r][c];positions.push(a);a.s=null}for(let tryN=0;tryN<90;tryN++){let vals=shuffle(positions.map(a=>a.g));positions.forEach((a,i)=>a.g=vals[i]);if(!getMatches().length&&findMove())return}for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let a=get(r,c);if(a.on&&!a.block){a.g=rand(4);a.s=null}}}
function delay(ms){return new Promise(ok=>setTimeout(ok,ms))}
function tone(freq=450,len=.1,type='sine',volume=.045){if(!sound)return;try{let ac=window._gardenAudio||(window._gardenAudio=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.2,t+len);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+len+.01)}catch(e){}}
function vibrate(ms=12){try{navigator.vibrate?.(ms)}catch(e){}}
function spawnBurst(r,c,color='#fff1a0',number=10){let p=toPx(r,c);for(let i=0;i<number;i++){let a=Math.random()*TAU,s=(Math.random()*.12+.05)*layout.tile;particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s*4,vy:Math.sin(a)*s*4-.5,age:0,life:400+rand(350),color,size:2+Math.random()*4})}}
function floatLabel(t,r,c,color='#fff'){let p=toPx(r,c);floating.push({t,x:p.x,y:p.y,age:0,color})}
function hasGoal(){return goalJelly<=0&&goalBlock<=0}
function endTurn(){busy=false;selected=null;hint=null;lastAction=performance.now();if(hasGoal()){mode='won';winStars=score>7500?3:score>3900?2:1;progress=Math.max(progress,lvl+2);try{localStorage.setItem('gardenGemUnlocked',String(Math.min(LEVELS.length,progress)))}catch(e){};tone(660,.28);setTimeout(()=>tone(880,.27),120);return}
  if(moves<=0){mode='lost';tone(245,.28);return}
  if(!findMove()){rearrange();floatLabel('シャッフル！',5,5,'#fff');tone(530,.2)} }
function breakBlock(a){if(!a||!a.block)return;const wasGoal=a.block===goalType;a.block=null;a.hp=0;a.g=rand(4);if(wasGoal)goalBlock=Math.max(0,goalBlock-1)}
function addGoalDamage(r,c,hitAlready){let around=[[0,0],[-1,0],[1,0],[0,-1],[0,1]];for(let [dr,dc] of around){let nr=r+dr,nc=c+dc,v=get(nr,nc);if(!v||!v.on||!v.block)continue;let key=nr+':'+nc;if(hitAlready.has(key))continue;hitAlready.add(key);v.hp--;if(v.hp<=0){breakBlock(v);spawnBurst(nr,nc,'#e6c3a2',13);score+=120;} }}
function explodeAround(r,c,rad,removed){for(let rr=r-rad;rr<=r+rad;rr++)for(let cc=c-rad;cc<=c+rad;cc++){let a=get(rr,cc);if(a&&a.on){if(a.block){breakBlock(a);spawnBurst(rr,cc,'#fff0b8',10)}else if(a.g>=0)removed.add(rr+':'+cc)}}}
function specialBlast(r,c,s,removed){let rowRange=[],colRange=[];if(s==='h'||s==='bomb'||s==='rainbow')for(let cc=0;cc<COLS;cc++)rowRange.push([r,cc]);if(s==='v'||s==='bomb')for(let rr=0;rr<ROWS;rr++)colRange.push([rr,c]);if(s==='bomb'){explodeAround(r,c,1,removed);return}if(s==='rainbow'){let hits=[];for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(gemCell(rr,cc))hits.push([rr,cc]);shuffle(hits);hits.slice(0,Math.ceil(hits.length*.36)).forEach(([rr,cc])=>removed.add(rr+':'+cc));return}for(let [rr,cc] of [...rowRange,...colRange]){let a=get(rr,cc);if(a?.on){if(a.block){breakBlock(a)}else if(a.g>=0)removed.add(rr+':'+cc)}}}
async function clearMatches(groups,fromSwap=null){if(!groups.length)return false;let removed=new Set(),bonus=null;const involved=new Map();groups.forEach(g=>g.forEach(p=>{let key=p.r+':'+p.c;removed.add(key);involved.set(key,(involved.get(key)||0)+1)}));
  if(fromSwap){let target=fromSwap.b;let line=groups.find(g=>g.length>=4&&g.some(p=>p.r===target.r&&p.c===target.c))||groups.find(g=>g.length>=4);let cross=[...involved].find(([,ct])=>ct>=2);
    if(cross)bonus={r:fromSwap.b.r,c:fromSwap.b.c,s:'bomb'};
    else if(line){let targetPos=line.find(p=>p.r===target.r&&p.c===target.c)||line[Math.floor(line.length/2)];bonus={...targetPos,s:line.length>=5?'rainbow':line[0].r===line[1].r?'h':'v'};}
  }else{let line=groups.find(g=>g.length>=4);if(line){let mid=line[Math.floor(line.length/2)];bonus={...mid,s:line.length>=5?'rainbow':line[0].r===line[1].r?'h':'v'}}}
  if(bonus)removed.delete(bonus.r+':'+bonus.c);
  // Cascade existing special pieces if they are matched.
  for(let iter=0;iter<3;iter++){let old=removed.size;for(let k of [...removed]){let [r,c]=k.split(':').map(Number),a=get(r,c);if(a?.s){let special=a.s;a.s=null;specialBlast(r,c,special,removed)}}if(removed.size===old)break}
  tone(335+combo*80,.095,'sine',.05);vibrate(15);await delay(125);
  const hitAlready=new Set();for(let k of removed){let [r,c]=k.split(':').map(Number),a=get(r,c);if(!a||!a.on||a.block)continue;if(a.j){a.j--;goalJelly=Math.max(0,goalJelly-1);score+=50;spawnBurst(r,c,'#f8b5e8',6)}addGoalDamage(r,c,hitAlready);a.g=-1;a.s=null;score+=75+combo*20;spawnBurst(r,c,PALETTE[rand(4)],5)}
  if(bonus){let cell=get(bonus.r,bonus.c);if(cell&&!cell.block){cell.s=bonus.s;cell.g=0;floatLabel(bonus.s==='rainbow'?'レインボー！':'スペシャル！',bonus.r,bonus.c,'#fff4a5');tone(700,.14)}}
  gravity();if(combo>1)floatLabel('COMBO × '+combo,4,5,'#fff5a2');await delay(160);return true}
function gravity(){for(let c=0;c<COLS;c++){let r=ROWS-1;while(r>=0){let end=r;while(end>=0&&(!grid[end][c].on||grid[end][c].block))end--;if(end<0){r=-1;break}let start=end;while(start-1>=0&&grid[start-1][c].on&&!grid[start-1][c].block)start--;let list=[];for(let k=end;k>=start;k--)if(grid[k][c].g>=0)list.push({g:grid[k][c].g,s:grid[k][c].s});for(let k=end;k>=start;k--){let val=list[end-k]||{g:rand(4),s:null};grid[k][c].g=val.g;grid[k][c].s=val.s}r=start-1}}}
async function resolve(fromSwap){let n=0;while(n<18){let groups=getMatches();if(!groups.length)break;combo=++n;await clearMatches(groups,n===1?fromSwap:null);if(hasGoal())break;}endTurn()}
async function performSwap(a,b){if(busy||mode!=='play')return;let A=get(a.r,a.c),B=get(b.r,b.c);if(!gemCell(a.r,a.c)||!gemCell(b.r,b.c))return;if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1){selected=b;return}
  busy=true;selected=null;lastAction=performance.now();swapGem(a,b);tone(310,.065,'sine',.027);
  if(A.s||B.s){moves--;turnNum++;let used=[{p:a,s:A.s},{p:b,s:B.s}].filter(o=>o.s);await delay(125);let removed=new Set([a.r+':'+a.c,b.r+':'+b.c]);for(let q of used)specialBlast(q.p.r,q.p.c,q.s,removed);const hitAlready=new Set();for(let k of removed){let [r,c]=k.split(':').map(Number),z=get(r,c);if(!z?.on||z.block)continue;if(z.j){z.j--;goalJelly=Math.max(0,goalJelly-1);score+=50}addGoalDamage(r,c,hitAlready);z.g=-1;z.s=null;score+=90;spawnBurst(r,c,'#ffde61',7)}gravity();await delay(140);await resolve(null);return}
  const m=getMatches();if(!m.length){await delay(120);swapGem(a,b);shake={r:a.r,c:a.c,until:performance.now()+250};tone(210,.13,'triangle',.02);busy=false;return}
  moves--;turnNum++;combo=0;await delay(90);await resolve({a,b});}
async function useTool(r,c){if(busy||!tool||mode!=='play')return;let kind=tool;let a=get(r,c);if(kind!=='shuffle'&&(!a||!a.on))return;if(tools[kind]<=0){tool=null;return}busy=true;tools[kind]--;tool=null;selected=null;lastAction=performance.now();tone(650,.16,'triangle',.08);
  if(kind==='shuffle'){rearrange();floatLabel('シャッフル！',5,5,'#fff');await delay(260);endTurn();return}
  let rem=new Set();if(kind==='hammer'){if(a.block){breakBlock(a)}else{rem.add(r+':'+c)}}
  if(kind==='rocket')for(let cc=0;cc<COLS;cc++)rem.add(r+':'+cc);
  if(kind==='rainbow'){let chosen=a.g,active=[];for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(gemCell(rr,cc)&&grid[rr][cc].g===chosen)active.push(rr+':'+cc);active.forEach(z=>rem.add(z))}
  let hitAlready=new Set();for(let k of rem){let [rr,cc]=k.split(':').map(Number),z=get(rr,cc);if(!z?.on)continue;if(z.block){breakBlock(z)}else {if(z.j){z.j--;goalJelly=Math.max(0,goalJelly-1);score+=50}addGoalDamage(rr,cc,hitAlready);z.g=-1;z.s=null;score+=75}spawnBurst(rr,cc,'#ffe16a',12)}
  spawnBurst(r,c,'#ffffff',25);await delay(230);gravity();await delay(170);combo=0;await resolve(null)}
function toPx(r,c){return {x:layout.x+(c+.5)*layout.tile,y:layout.y+(r+.5)*layout.tile}}
function locate(x,y){let c=Math.floor((x-layout.x)/layout.tile),r=Math.floor((y-layout.y)/layout.tile);return get(r,c)?.on?{r,c}:null}
function inRect(x,y,rx,ry,rw,rh){return x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh}
function makeHit(name,x,y,w,h,action){menuButtons.push({name,x,y,w,h,action})}
function pointerAt(e){let r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}let p=pointerAt(e);pressed={...p,cell:locate(p.x,p.y),start:performance.now()}});
canvas.addEventListener('pointerup',e=>{e.preventDefault();let p=pointerAt(e),pr=pressed;pressed=null;if(!pr)return;
  for(let i=menuButtons.length-1;i>=0;i--){let b=menuButtons[i];if(inRect(p.x,p.y,b.x,b.y,b.w,b.h)){b.action();return}}
  if(mode!=='play'||busy)return;let picked=locate(p.x,p.y);if(tool){if(tool==='shuffle')useTool(5,5);else if(picked)useTool(picked.r,picked.c);return}
  if(pr.cell&&picked&&(pr.cell.r!==picked.r||pr.cell.c!==picked.c)){performSwap(pr.cell,picked);return}
  if(!picked){selected=null;return}if(selected){if(selected.r===picked.r&&selected.c===picked.c){selected=null;return}if(Math.abs(selected.r-picked.r)+Math.abs(selected.c-picked.c)===1){performSwap(selected,picked);return}}
  selected=picked;tone(510,.045,'sine',.018);
});
canvas.addEventListener('pointercancel',()=>{pressed=null});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(mode==='settings')mode='play';else if(mode==='play')mode='settings'}if(e.key.toLowerCase()==='r'&&mode==='play')startLevel(lvl);if(e.key.toLowerCase()==='h'&&mode==='play')hint=findMove()});
